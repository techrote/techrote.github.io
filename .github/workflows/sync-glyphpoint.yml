name: Sync GlyphPoint hosted mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-glyphpoint.yml'

permissions:
  contents: write

concurrency:
  group: sync-glyphpoint
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch canonical GlyphPoint build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p glyphpoint
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/techrote/GlyphPoint/main/GlyphPoint-RC.html' \
            --output glyphpoint/index.html.tmp
          test "$(wc -c < glyphpoint/index.html.tmp)" -gt 500000
          grep -q 'Precision Glyph Grid Editor' glyphpoint/index.html.tmp
          grep -q 'glyphpoint-v3' glyphpoint/index.html.tmp
          grep -q 'DejaVu Sans Mono' glyphpoint/index.html.tmp
          mv glyphpoint/index.html.tmp glyphpoint/index.html

      - name: Verify GlyphPoint tile and project information
        shell: python
        run: |
          from pathlib import Path

          text = Path('index.html').read_text(encoding='utf-8')
          expected = '<div class="actions"><a href="glyphpoint/">OPEN</a><a href="projects/glyphpoint.html">INFO</a><a href="https://github.com/techrote/GlyphPoint">GITHUB</a></div>'
          if text.count('<h3>GlyphPoint</h3>') != 1 or text.count(expected) != 1:
              raise SystemExit('Expected one current GlyphPoint tile with OPEN/INFO/GITHUB links')
          if not Path('projects/glyphpoint.html').is_file():
              raise SystemExit('GlyphPoint project information page missing')

      - name: Commit mirror when changed
        shell: bash
        run: |
          set -euo pipefail
          git add glyphpoint/index.html
          if git diff --cached --quiet; then
            echo 'GlyphPoint mirror already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync GlyphPoint hosted mirror'
          git push origin HEAD:main
