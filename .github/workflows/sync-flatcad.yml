name: Build flatCAD hosted webapp

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'projects/flatcad.html'
      - 'tests/gallery.test.mjs'
      - 'tests/flatcad-hosted.test.mjs'
      - '.github/workflows/sync-flatcad.yml'
      - 'flatcad/**'
  workflow_dispatch:

# Publish built assets only to an in-repo review branch. Native branch-based
# GitHub Pages deployment happens on the subsequent reviewed PR merge.
permissions:
  contents: write

concurrency:
  group: flatcad-hosted-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-test-stage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout IO review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Checkout accepted flatCAD snapshot
        uses: actions/checkout@v4
        with:
          repository: techrote/flatCAD
          ref: 50c2835f9b8eb6006fd7497c8b75d72085f9ecc0
          path: .flatcad-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build actual flatCAD app, worker and WASM bundle
        working-directory: .flatcad-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "50c2835f9b8eb6006fd7497c8b75d72085f9ecc0"
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Stage self-contained app and third-party license texts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf flatcad
          mkdir -p flatcad
          rsync -a .flatcad-source/dist/ flatcad/
          test -s flatcad/index.html
          test -d flatcad/assets
          find flatcad/assets -type f -name '*.wasm' -size +100k | grep -q .
          find flatcad/assets -type f -name '*.js' | grep -q .
          ! grep -Fq 'src/main.ts' flatcad/index.html
          grep -q './assets/' flatcad/index.html

          mkdir -p flatcad/licenses
          for entry in replicad-opencascadejs:LGPL-2.1.txt replicad:replicad-MIT.txt three:three-MIT.txt; do
            package="$(echo "$entry" | cut -d: -f1)"
            output="$(echo "$entry" | cut -d: -f2)"
            license="$(find ".flatcad-source/node_modules/$package" -maxdepth 1 -type f \
              \( -iname 'license*' -o -iname 'copying*' \) -print -quit)"
            if [ -z "$license" ]; then echo "::error::Missing license for $package"; exit 1; fi
            cp "$license" "flatcad/licenses/$output"
          done
          cat > flatcad/BUILD-INFO.json <<'JSON'
          {
            "source": "https://github.com/techrote/flatCAD",
            "commit": "50c2835f9b8eb6006fd7497c8b75d72085f9ecc0",
            "sourceBuild": "npm install --no-audit --no-fund && npm run build",
            "deployment": "/flatcad/",
            "dependencies": {
              "replicad": "1.1.0",
              "replicad-opencascadejs": "1.1.0",
              "three": "0.180.0"
            }
          }
          JSON
          cat > flatcad/THIRD-PARTY-NOTICES.md <<'NOTICES'
          # flatCAD hosted build — provenance and notices

          This is a static, local-first Beta 1 build of [flatCAD](https://github.com/techrote/flatCAD).
          Authoritative source: commit 50c2835f9b8eb6006fd7497c8b75d72085f9ecc0. The Vite bundle, dedicated
          OpenCascade worker and local WASM file are copied from that source's
          production build. See [BUILD-INFO.json](BUILD-INFO.json).

          This distribution does not assign a license to flatCAD's own source code.
          Third-party components include:

          - **replicad 1.1.0** (MIT): see [license](licenses/replicad-MIT.txt)
            and [source](https://github.com/sgenoud/replicad).
          - **replicad-opencascadejs 1.1.0** (LGPL-2.1-only), comprising the
            WebAssembly OpenCascade-based geometry runtime: see
            [full license text](licenses/LGPL-2.1.txt) and
            [source/build material](https://github.com/sgenoud/replicad).
            The WASM file is shipped as a separate local asset and can be
            replaced with a compatible rebuild of the same runtime.
          - **Three.js 0.180.0** (MIT): see [license](licenses/three-MIT.txt)
            and [source](https://github.com/mrdoob/three.js).

          Review upstream OpenCascade license/exception and exact transitive
          dependencies when redistributing modified binaries. This Beta build
          is not independently certified for manufacturing tolerances or STEP
          interoperability. All geometry processing runs in the user's browser.
          NOTICES

      - name: Install CI browser
        working-directory: .flatcad-source
        run: npx playwright install --with-deps chromium

      - name: Test genuine subdirectory hosting, solid evaluation and STEP export
        run: node tests/flatcad-hosted.test.mjs

      - name: Commit reviewed-branch snapshot after all gates pass
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "::error::Stage via a feature branch and merge by PR. Bot commits to main do not trigger native Pages."
            exit 1
          fi
          git add -A flatcad/
          if git diff --cached --quiet; then
            echo 'Hosted flatCAD assets already match the tested source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage tested flatCAD Beta 1 webapp assets'
          git push origin "HEAD:$TARGET_BRANCH"
