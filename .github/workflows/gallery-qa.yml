name: Gallery responsive and navigation QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'directory.html'
      - 'groupjects/**'
      - 'tests/groupjects.test.mjs'
      - 'projects/relay-moth-forest.html'
      - 'gallery/**'
      - 'shattered-art-stash/**'
      - 'signal-relics/**'
      - 'salvage-apparatus/**'
      - 'salvage-arcade/**'
      - 'tests/gallery.test.mjs'
      - '.github/workflows/gallery-qa.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'directory.html'
      - 'groupjects/**'
      - 'tests/groupjects.test.mjs'
      - 'projects/relay-moth-forest.html'
      - 'gallery/**'
      - 'shattered-art-stash/**'
      - 'signal-relics/**'
      - 'salvage-apparatus/**'
      - 'salvage-arcade/**'
      - 'tests/gallery.test.mjs'
      - '.github/workflows/gallery-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/gallery.test.mjs
      - run: node tests/groupjects.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groupject-visual-qa
          path: screenshots/groupjects/
          if-no-files-found: ignore
          retention-days: 14
