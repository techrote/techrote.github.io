<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05060f"><title>S079 — JULIA HUNT</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Every point of the Mandelbrot map is a different Julia set. Wander until you land on the named ones.
const REG=[['RABBIT',-.123,.745],['DENDRITE',0,1],['BASILICA',-1,0],['SIEGEL DISK',-.391,-.587],['DRAGON',-.8,.156],['COASTLINE',-.7269,.1889]];
const JW=240,JH=150,MW=150,MH=100,IT=70;
let cr=-.4,ci=.6,vx=0,vy=0,jc=null,jd=null,jimg=null,mc=null,found=new Set(),dirty=true,near=-1,pal=[],mimg=null,score=0;
for(let i=0;i<256;i++){const t=i/255;pal.push([Math.round(8+Math.pow(t,.6)*240),Math.round(10+Math.pow(t,1.2)*190),Math.round(30+Math.sin(t*3)*100+t*110)])}
function julia(){const d=jimg.data;for(let y=0;y<JH;y++)for(let x=0;x<JW;x++){let zr=(x/JW-.5)*3.2,zi=(y/JH-.5)*2,k=0;while(k<IT&&zr*zr+zi*zi<16){const t=zr*zr-zi*zi+cr;zi=2*zr*zi+ci;zr=t;k++}const o=(y*JW+x)*4;if(k>=IT){d[o]=4;d[o+1]=6;d[o+2]=14}else{const q=pal[Math.min(255,Math.floor(k/IT*255*2.2))];d[o]=q[0];d[o+1]=q[1];d[o+2]=q[2]}d[o+3]=255}jd.putImageData(jimg,0,0)}
function mandel(){const m=mc.getContext('2d'),im=m.createImageData(MW,MH),d=im.data;for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const c0=-2.2+x/MW*3,c1=(y/MH-.5)*2.4;let zr=0,zi=0,k=0;while(k<40&&zr*zr+zi*zi<16){const t=zr*zr-zi*zi+c0;zi=2*zr*zi+c1;zr=t;k++}const o=(y*MW+x)*4,v=k>=40?10:Math.min(255,40+k*10);d[o]=v*.5;d[o+1]=v*.7;d[o+2]=v;d[o+3]=255}m.putImageData(im,0,0)}
const mpos=K=>({x:K.w-MW*1.4-22,y:K.h-MH*1.4-80,s:1.4});
Salvage({id:'S079',title:'JULIA HUNT',parent:'019 MOIRE APPARITION',scanlines:false,
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> MOVE THROUGH THE PARAMETER MAP (HOLD TO ACCELERATE)<br>LAND ON EACH NAMED SET / CLICK OR DRAG ON THE SMALL MAP TO JUMP THERE',
 aria:'A Julia set explorer. The large image is the Julia set for a complex parameter c; the small image in the corner is the Mandelbrot map of all parameters, with a marker for the current one. Arrow keys move c, and clicking or dragging on the small map jumps to a point. Six named kinds of set, such as the rabbit and the dendrite, can be found by landing close to their parameters; found ones are listed.',
 reset(K){jc=document.createElement('canvas');jc.width=JW;jc.height=JH;jd=jc.getContext('2d');jimg=jd.createImageData(JW,JH);mc=document.createElement('canvas');mc.width=MW;mc.height=MH;mandel();cr=-.4;ci=.6;vx=vy=0;found=new Set();dirty=true;score=0},
 key(K,e,fresh){if(/^Arrow|^Key[WASD]$|^Space$/.test(e.code))return true},
 down(K,x,y){const m=mpos(K);if(x>=m.x&&x<=m.x+MW*m.s&&y>=m.y&&y<=m.y+MH*m.s){cr=-2.2+(x-m.x)/(MW*m.s)*3;ci=((y-m.y)/(MH*m.s)-.5)*2.4;dirty=true;return false}return false},
 step(K,dt){
  const dx=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0),dy=(K.keys.has('ArrowDown')||K.keys.has('KeyS')?1:0)-(K.keys.has('ArrowUp')||K.keys.has('KeyW')?1:0);
  vx+=dx*dt*.9;vy+=dy*dt*.9;const f=Math.exp(-dt*5);vx*=f;vy*=f;if(Math.abs(vx)+Math.abs(vy)>.0004||dx||dy){cr=K.clamp(cr+vx*dt,-2.2,.8);ci=K.clamp(ci+vy*dt,-1.2,1.2);dirty=true}
  const p=K.pointer,m=mpos(K);if(p.held&&p.inside&&p.x>=m.x&&p.x<=m.x+MW*m.s&&p.y>=m.y&&p.y<=m.y+MH*m.s){const nr=-2.2+(p.x-m.x)/(MW*m.s)*3,ni=((p.y-m.y)/(MH*m.s)-.5)*2.4;if(nr!==cr||ni!==ci){cr=nr;ci=ni;dirty=true}}
  if(dirty){julia();dirty=false}
  near=-1;REG.forEach(([n,a,b],i)=>{const d=Math.hypot(cr-a,ci-b);if(d<.025){near=i;if(!found.has(n)){found.add(n);score+=100;K.note('FOUND / '+n+' / '+found.size+' OF '+REG.length)}}});
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K;c.fillStyle='#05060f';c.fillRect(0,0,w,h);const s=Math.min(w*.92/JW,h*.7/JH);c.imageSmoothingEnabled=true;c.drawImage(jc,(w-JW*s)/2,h*.12,JW*s,JH*s);
  const m=mpos(K);c.fillStyle='#05070ecc';c.fillRect(m.x-8,m.y-22,MW*m.s+16,MH*m.s+30);c.drawImage(mc,m.x,m.y,MW*m.s,MH*m.s);c.strokeStyle='#2a3d5e';c.strokeRect(m.x-.5,m.y-.5,MW*m.s+1,MH*m.s+1);
  REG.forEach(([n,a,b])=>{const x=m.x+(a+2.2)/3*MW*m.s,y=m.y+(b/2.4+.5)*MH*m.s;c.strokeStyle=found.has(n)?'#f4d84e':'#4f6b80';c.beginPath();c.arc(x,y,4,0,TAU);c.stroke()});
  const mx=m.x+(cr+2.2)/3*MW*m.s,my=m.y+(ci/2.4+.5)*MH*m.s;c.strokeStyle='#faffdb';c.lineWidth=1.5;c.beginPath();c.moveTo(mx-7,my);c.lineTo(mx+7,my);c.moveTo(mx,my-7);c.lineTo(mx,my+7);c.stroke();c.lineWidth=1;
  c.font='9px monospace';c.fillStyle='#faffdb';c.fillText('c = '+cr.toFixed(4)+(ci>=0?' + ':' − ')+Math.abs(ci).toFixed(4)+'i',m.x,m.y-8);
  c.fillStyle='#9fc4d6';c.fillText('COLLECTION',22,h*.12);REG.forEach(([n],i)=>{c.fillStyle=found.has(n)?'#f4d84e':near===i?'#faffdb':'#4f6b80';c.fillText((found.has(n)?'● ':'○ ')+n,22,h*.12+18+i*14)});
  if(near>=0){c.fillStyle='#faffdb';c.textAlign='center';c.font='11px monospace';c.fillText('≈ '+REG[near][0],w/2,h*.12-8);c.textAlign='left'}
  if(p.inside&&p.x>=m.x&&p.x<=m.x+MW*m.s&&p.y>=m.y&&p.y<=m.y+MH*m.s){c.fillStyle='#faffdb';c.fillText('JUMP',p.x+10,p.y-6)}
 },
 readout:K=>['FOUND '+found.size+'/'+REG.length,'c '+cr.toFixed(3)+' '+(ci>=0?'+':'−')+' '+Math.abs(ci).toFixed(3)+'i']
});
})();
</script></body></html>
