(() => {

}
function prepareLetters(){

 letterRows=['MOUTH','FEEL'].map(word=>{let x=0;return Array.from(word).map(char=>{const a={char,x,width:ctx.measureText(char).width};x+=a.width-letterSize*.07;return a})});
}
function notify(s){document.getElementById('announce').textContent=s}
function sync(){still.textContent=paused?'Resume':'Pause';still.setAttribute('aria-pressed',String(paused))}
function queue(){if(!frame&&!paused&&!document.hidden)frame=requestAnimationFrame(tick)}
function tick(now){
 frame=0;const dt=Math.min((now-last)||16,40)/1000;last=now;time+=dt;
 const ease=1-Math.exp(-dt*8);pointer.ex+=(pointer.x-pointer.ex)*ease;pointer.ey+=(pointer.y-pointer.ey)*ease;
 energy+=((down?1:inside?.22:0)-energy)*ease;bodySeed+=(seedTarget-bodySeed)*ease*.7;
 tear+=((down?1:0)-tear)*ease;draw();queue();
}
function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.75);
 canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);
 torn.width=canvas.width;torn.height=canvas.height;
 R=Math.min(W*(W<650?.65:.38),H*.57);CX=W*(W<650?.55:.59);CY=H*(W<650?.48:.51);prepareLetters();draw();
}
function poly(points,close=true){ctx.beginPath();points.forEach((a,i)=>i?ctx.lineTo(a[0],a[1]):ctx.moveTo(a[0],a[1]));if(close)ctx.closePath()}
function ellipse(x,y,rx,ry,color,angle=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),angle,0,TAU);ctx.fillStyle=color;ctx.fill()}
function distort(x,y,strength=1){
 const dx=pointer.ex*W-x,dy=pointer.ey*H-y;
 const influence=Math.exp(-(dx*dx+dy*dy)/(R*R*.24))*energy*strength;
 return [x+dx*influence*.74,y+dy*influence*.74];
}
function organicPath(x,y,r,phase,aspect=1){
 const pts=[];
 for(let i=0;i<60;i++){
  const a=i/60*TAU,rr=r*(1+.13*Math.sin(a*3+phase)+.12*Math.cos(a*5-time*.32+phase));
  pts.push(distort(x+Math.cos(a)*rr,y+Math.sin(a)*rr*aspect,.8));
 }
 ctx.beginPath();ctx.moveTo((pts[59][0]+pts[0][0])/2,(pts[59][1]+pts[0][1])/2);
 for(let i=0;i<60;i++){const n=pts[(i+1)%60];ctx.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+n[0])/2,(pts[i][1]+n[1])/2)}

function background(){

 for(let x=-W;x<W;x+=64){ctx.beginPath();ctx.moveTo(x,-H);ctx.lineTo(x+H*.25,H);ctx.stroke()}
 for(let y=-H;y<H;y+=64){ctx.beginPath();ctx.moveTo(-W,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.restore();
 ctx.save();ctx.translate(W*.86,H*.27);ctx.rotate(.2);
 ctx.strokeStyle=p.acid;ctx.lineWidth=1;ctx.globalAlpha=.45;
 ctx.font='900 '+Math.max(86,W*.12)+'px Arial';ctx.strokeText('NO',-W*.13,0);ctx.strokeText('THANK',-W*.28,H*.14);ctx.strokeText('YOU',-W*.1,H*.28);ctx.restore();
 // A cut-out slice of the wrong floor.

 ctx.beginPath();ctx.moveTo(-bw,-bh*.5);ctx.lineTo(bw*.7,-bh);ctx.lineTo(bw,bh*.5);ctx.lineTo(-bw*.7,bh);ctx.closePath();ctx.clip();
 ctx.fillStyle=p.acid;ctx.fillRect(-bw,-bh,bw*2,bh*2);
 ctx.fillStyle=p.ink;for(let i=-25;i<25;i++)for(let j=-10;j<10;j++)if((i+j)%2===0)ctx.fillRect(i*tile,j*tile,tile+.5,tile+.5);
 ctx.restore();
 // A violet sun with too many technical drawing annotations.
 ctx.save();ctx.translate(W*.81,H*.2);ctx.rotate(time*.035);
 ctx.strokeStyle=p.pink;ctx.lineWidth=1;
 for(let i=0;i<48;i++){const a=i/48*TAU;ctx.beginPath();ctx.moveTo(Math.cos(a)*R*.16,Math.sin(a)*R*.16);ctx.lineTo(Math.cos(a)*R*.26,Math.sin(a)*R*.26);ctx.stroke()}

function jelly(){
 const x=CX+R*.36,y=CY+R*.21,r=R*.57;
 ctx.save();organicPath(x+10,y+15,r,.5,1.07);ctx.fillStyle=p.ink;ctx.fill();
 organicPath(x,y,r,.5,1.07);ctx.clip();
 const g=ctx.createRadialGradient(x-r*.4,y-r*.4,r*.05,x,y,r*1.3);g.addColorStop(0,p.white);g.addColorStop(.24,p.pink);g.addColorStop(1,p.blue);ctx.fillStyle=g;ctx.fillRect(x-r*2,y-r*2,r*4,r*4);
 ctx.save();ctx.translate(x,y);ctx.rotate(-.7+Math.sin(time*.15)*.1);

 ctx.restore();ctx.restore();
 organicPath(x,y,r,.5,1.07);ctx.strokeStyle=p.ink;ctx.lineWidth=2;ctx.stroke();
 // A suture that is much too neat for the rest of the specimen.
 ctx.save();ctx.translate(x+r*.5,y);ctx.rotate(-.23);ctx.strokeStyle=p.white;ctx.lineWidth=1.7;
 ctx.beginPath();ctx.moveTo(0,-r*.7);ctx.bezierCurveTo(-r*.3,-r*.3,r*.3,r*.3,0,r*.7);ctx.stroke();
 for(let i=0;i<12;i++){const s=i/11,yy=(s*1.4-.7)*r,xx=Math.sin(s*TAU)*-r*.085;ctx.beginPath();ctx.moveTo(xx-r*.04,yy-r*.015);ctx.lineTo(xx+r*.04,yy+r*.015);ctx.stroke()}

}
function centerAt(s){
 const a=s*TAU+bodySeed*.34;
 const wobble=Math.sin(time*.36+a*3)*.035;
 const x=(Math.sin(a)*.67+Math.sin(a*2+bodySeed)*.21)*(1+wobble);
 const y=(Math.cos(a)*.64+Math.cos(a*3+bodySeed*.7)*.15);

function buildTube(){
 for(let i=0;i<=COUNT;i++){
  const s=i/COUNT,a=centerAt(s),prev=centerAt(s-.001),next=centerAt(s+.001);
  const dx=next[0]-prev[0],dy=next[1]-prev[1],len=Math.hypot(dx,dy)||1;
  const width=R*(.13+.055*Math.sin(s*TAU*3+time*.25+bodySeed)+.04*Math.cos(s*TAU*2));
  const k=i*5;spine[k]=a[0];spine[k+1]=a[1];spine[k+2]=-dy/len;spine[k+3]=dx/len;spine[k+4]=width;
  for(let j=0;j<=COLS;j++){
   const q=Math.sin((j/COLS-.5)*Math.PI),v=(i*(COLS+1)+j)*2;
   vertices[v]=a[0]+spine[k+2]*width*q;vertices[v+1]=a[1]+spine[k+3]*width*q;
  }

}
function tube(){
 buildTube();
 ctx.save();ctx.strokeStyle='#08000bb0';ctx.lineWidth=R*.3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 for(let i=0;i<=COUNT;i++){const k=i*5;i?ctx.lineTo(spine[k]+12,spine[k+1]+16):ctx.moveTo(spine[k]+12,spine[k+1]+16)}ctx.stroke();ctx.restore();
 // This checkered skin is a mesh, so its tiles bend with the entire knot.

  const a=i*(COLS+1)*2,b=(i+1)*(COLS+1)*2,k=i*5;
  for(let j=0;j<COLS;j++){
   const n=j*2;
   ctx.beginPath();ctx.moveTo(vertices[a+n],vertices[a+n+1]);ctx.lineTo(vertices[b+n],vertices[b+n+1]);ctx.lineTo(vertices[b+n+2],vertices[b+n+3]);ctx.lineTo(vertices[a+n+2],vertices[a+n+3]);ctx.closePath();

   ctx.fillStyle=check?p.ink:p.acid;ctx.fill();ctx.lineWidth=.55;ctx.strokeStyle=ctx.fillStyle;ctx.stroke();

function eye(x,y,size,angle,odd=0){

function appendages(){
 // A bundle of feelers escapes from the organism.

function lettering(){

  const influence=inside?Math.max(0,1-d/(letterSize*1.5)):0;
  const jump=influence*letterSize*(down?.3:.12)*Math.sin(i*2.7+index);
  ctx.save();ctx.translate(letter.x,baseY+jump);ctx.rotate(influence*Math.sin(i*4+time*.5)*.12);ctx.scale(1,1+influence*(down?.3:.08));ctx.fillText(letter.char,0,0);ctx.restore();
 }));
 ctx.restore();
}
function tearImage(){
 if(tear<.02)return;
 tornCtx.clearRect(0,0,torn.width,torn.height);tornCtx.drawImage(canvas,0,0);
 const center=pointer.ey*H,reach=R*.45*tear;
 ctx.save();ctx.globalAlpha=Math.min(.85,tear);
 // Small offset scanlines shear the paper without full-screen flashes.
 for(let i=-4;i<=4;i++){
  const y=clamp(center+i*reach*.2,0,H-1),band=Math.min(H-y,Math.max(2,R*.009*(i%2?2:1)));
  const shift=Math.sin(i*5.7+time*.8)*R*.11*tear;
  ctx.drawImage(torn,0,y*D,torn.width,band*D,shift,y,W,band);
  ctx.fillStyle=i%2?p.acid:p.pink;ctx.fillRect(clamp(pointer.ex*W+shift,0,W),y,Math.abs(shift)*.8,1);
 }
 ctx.restore();
}
function drawScars(){
 for(const scar of scars){
  ctx.strokeStyle=p.pink;ctx.lineWidth=2;ctx.beginPath();
  scar.forEach((pt,i)=>i?ctx.lineTo(pt[0]*W,pt[1]*H):ctx.moveTo(pt[0]*W,pt[1]*H));ctx.stroke();
  for(let i=2;i<scar.length;i+=3){const pt=scar[i],prev=scar[i-2],dx=pt[0]*W-prev[0]*W,dy=pt[1]*H-prev[1]*H,d=Math.hypot(dx,dy)||1;
   ctx.strokeStyle=p.acid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pt[0]*W-dy/d*5,pt[1]*H+dx/d*5);ctx.lineTo(pt[0]*W+dy/d*5,pt[1]*H-dx/d*5);ctx.stroke();}
 }
 if(down&&trail.length>1){ctx.strokeStyle=p.white;ctx.lineWidth=1;ctx.setLineDash([3,5]);poly(trail.map(pt=>[pt[0]*W,pt[1]*H]),false);ctx.stroke();ctx.setLineDash([])}
}
function draw(){
 background();appendages();jelly();tube();mouth();
 const a=centerAt(.1),b=centerAt(.65);
 eye(a[0],a[1],R*.105,-.55,1);eye(b[0],b[1],R*.09,.3,2);
 eye(CX+R*.42,CY+R*.31,R*.14,.26,3);eye(CX+R*.17,CY+R*.5,R*.066,-.5,4);
 stickers();drawScars();
 extraEyes.forEach((e,i)=>eye(e.x*W,e.y*H,R*e.r,e.a,i+5));
 lettering();tearImage();ctx.fillStyle=grain;ctx.fillRect(0,0,W,H);
 if(inside){
  const x=pointer.x*W,y=pointer.y*H;ctx.strokeStyle=p.white;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,down?22:12,0,TAU);ctx.moveTo(x-18,y);ctx.lineTo(x+18,y);ctx.moveTo(x,y-18);ctx.lineTo(x,y+18);ctx.stroke();
  ctx.font='9px monospace';ctx.fillStyle=p.acid;ctx.fillText(down?'FEEDING':'HELLO, STRANGER',x+22,y-12);
 }
}
function updatePointer(e){pointer.x=clamp(e.clientX/W,-.1,1.1);pointer.y=clamp(e.clientY/H,-.1,1.1);inside=true;if(paused){pointer.ex=pointer.x;pointer.ey=pointer.y;energy=down?1:.22;tear=down?1:0}}
stage.addEventListener('pointermove',e=>{
 if(!e.isPrimary||(activePointer!==null&&e.pointerId!==activePointer))return;
 updatePointer(e);
 if(down){dragged=dragged||Math.hypot(e.clientX-pointer.sx,e.clientY-pointer.sy)>6;trail.push([pointer.x,pointer.y]);if(trail.length>65)trail.shift()}
 if(paused)draw();
},{passive:true});
stage.addEventListener('pointerdown',e=>{
 if(e.button!==0||!e.isPrimary||activePointer!==null)return;activePointer=e.pointerId;down=true;dragged=false;pointer.sx=e.clientX;pointer.sy=e.clientY;trail.length=0;updatePointer(e);trail.push([pointer.x,pointer.y]);stage.setPointerCapture(e.pointerId);if(paused)draw();
});
function release(e,cancelled=false){
 if(!down||e.pointerId!==activePointer)return;down=false;activePointer=null;
 dragged=dragged||Math.hypot(e.clientX-pointer.sx,e.clientY-pointer.sy)>6;
 if(!cancelled){updatePointer(e);trail.push([pointer.x,pointer.y])}
 if(!cancelled){
  if(dragged){scars.push(trail.slice());if(scars.length>3)scars.shift();notify('A new scar remains. The organism remembers.')}
  else{extraEyes.push({x:pointer.x,y:pointer.y,r:.035+rand(extraEyes.length+3)*.04,a:rand(extraEyes.length+10)*1.6-.8});if(extraEyes.length>12)extraEyes.shift();notify('An eye has appeared. It is watching your pointer.')}
 }
 trail.length=0;if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);
 if(paused){energy=inside?.22:0;tear=0;draw()}
}
stage.addEventListener('pointerup',e=>release(e));stage.addEventListener('pointercancel',e=>release(e,true));
stage.addEventListener('pointerleave',()=>{if(!down){inside=false;if(paused){energy=0;draw()}}});
window.addEventListener('blur',()=>{down=false;activePointer=null;trail.length=0;inside=false;if(paused){energy=0;tear=0;draw()}});
function mutate(){
 specimen++;pi=(pi+1)%palettes.length;p=palettes[pi];seedTarget+=1.73;extraEyes.length=0;scars.length=0;prepareStipple();
 if(paused)bodySeed=seedTarget;
 document.getElementById('status').textContent='SPECIMEN '+String(specimen).padStart(3,'0')+' · '+['EMOTIONALLY UNSTABLE','INCONVENIENTLY ALIVE','NO KNOWN PURPOSE','DOING ITS WORST'][pi];
 document.body.style.background=p.bg;notify('Specimen '+specimen+'. A new colour and shape mutation.');draw();
}
function togglePause(){paused=!paused;sync();if(paused){cancelAnimationFrame(frame);frame=0;draw()}else{last=performance.now();queue()}}
document.getElementById('mutate').addEventListener('click',mutate);still.addEventListener('click',togglePause);
window.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('button,input,textarea,select'))return;if(e.code==='Space'){e.preventDefault();mutate()}else if(e.code==='KeyP')togglePause()});
document.getElementById('save').addEventListener('click',()=>{
 const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;
 const c=out.getContext('2d');c.drawImage(canvas,0,0);c.scale(D,D);
 c.fillStyle=p.white;c.font='11px monospace';c.fillText('MOUTHFEEL / SPECIMEN '+String(specimen).padStart(3,'0')+' / '+new Date().toISOString().slice(0,10),20,H-22);
 out.toBlob(blob=>{if(!blob){notify('The image could not be saved. Please try again.');return}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='mouthfeel-'+String(specimen).padStart(3,'0')+'.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('Your specimen has been collected as a PNG.')},'image/png');
});
reduced.addEventListener('change',e=>{paused=e.matches;sync();if(paused){cancelAnimationFrame(frame);frame=0;draw()}else{last=performance.now();queue()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0}else{last=performance.now();queue()}});
window.addEventListener('resize',resize);sync();prepareStipple();resize();document.querySelector('.fallback').style.display='none';document.querySelector('h1').style.opacity='0';queue();
})();
</script>
</body>
</html>
